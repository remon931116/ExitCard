<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExitCard — UI 改版對照</title>
<style>
:root{font-family:Arial,sans-serif;color:#191919;background:#f3ebdd}body{margin:24px auto;padding:0 20px;max-width:1500px}h1{font-size:28px}label{font-weight:bold}select,a{font:inherit}select{padding:8px;background:#fffcf5;border:2px solid #191919;border-radius:4px}a{color:#a83226}main{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}figure{margin:0;min-width:0}figcaption{padding:12px;background:#191919;color:#fffcf5;font-weight:bold}img{display:block;width:100%;height:auto;border:1px solid #191919;box-sizing:border-box}p{line-height:1.6}@media(max-width:650px){main{grid-template-columns:1fr}}
</style>
<h1>ExitCard · UI 改版對照</h1>
<p>復古運動 × 獨立雜誌。原操作與資料流程保留；手機日期間距及預覽縮放修正原有水平溢出。</p>
<label for="size">比較畫面 </label>
<select id="size"><option value="web-1440">桌面 1440px</option><option value="web-1024">桌面 1024px</option><option value="web-768">平板 768px</option><option value="web-390">手機 390px</option><option value="web-360">手機 360px</option><option value="connector">匯入擴充套件</option></select>
<main><figure><figcaption>改版前</figcaption><img id="before" src="before/web-1440.png" alt="改版前桌面畫面"></figure><figure><figcaption>改版後</figcaption><img id="after" src="after/web-1440.png" alt="改版後桌面畫面"></figure></main>
<p>狀態檢查：<a href="after/focus.png">鍵盤焦點</a> · <a href="after/pressed.png">按下</a> · <a href="after/disabled.png">停用</a> · <a href="after/empty.png">無課程</a> · <a href="after/long-content.png">長內容</a> · <a href="after/connector-error.png">匯入錯誤</a> · <a href="after/connector-success.png">匯入成功</a></p>
<p><a href="README.md">設計規格與驗證報告</a> · <a href="../../Web/index.html">開啟實際網頁</a></p>
<script>
document.getElementById('size').addEventListener('change',function(){for(const phase of ['before','after']){const img=document.getElementById(phase);img.src=phase+'/'+this.value+'.png';img.alt=(phase==='before'?'改版前':'改版後')+this.selectedOptions[0].textContent;}});
</script>
</html>
